    <!-- Script Sm -->
    <text x="28" y="38" text-anchor="middle" font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-weight="700" font-style="italic" font-size="28" fill="#0F2C59" letter-spacing="-1">Sm</text>
  </g>
  <!-- Brand Text -->
  <g transform="translate(78, 12)">
    <text x="0" y="24" font-family="'Cinzel', 'Outfit', 'Montserrat', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="4" fill="#0F2C59">SHIV MENS</text>
    <text x="2" y="42" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="9" letter-spacing="3.5" fill="#2563EB">PREMIUM MEN'S COLLECTION</text>
  </g>
